name: .NET CI

on:
  # Build+test is already run locally before every push, so there's no automatic push/PR trigger
  # here — only a manual run, or a v* release tag (which needs the build+test job as a gate before
  # publish-app runs).
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  dotnet:
    name: .NET solution (build + test)
    # Full compilation and verification of the Windows app happens here, on a real Windows runner —
    # local development only needs to compile the cross-platform pieces (see Directory.Build.props'
    # EnableWindowsTargeting for how that's possible on Linux at all).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Camledian.Photobooth.slnx

      - name: Build
        run: dotnet build Camledian.Photobooth.slnx -c Release --no-restore

      - name: Test
        run: dotnet test Camledian.Photobooth.slnx -c Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-test-results
          path: "**/test-results.trx"

  # Screenshots every kiosk screen in real fullscreen kiosk mode and uploads them as an artifact.
  # The UI is developed from a Linux devcontainer where WPF cannot render at all, so this runner is
  # the only place the result of a XAML change can actually be looked at. Manual runs only — same
  # Windows-minute reasoning as publish-app below.
  ui-screenshots:
    name: Kiosk UI screenshots
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build app
        run: dotnet build src/Camledian.Photobooth.App/Camledian.Photobooth.App.csproj -c Release

      # WinExe does not block the shell, so Start-Process -Wait is what actually gates the upload on
      # the capture pass being finished.
      - name: Capture kiosk screens
        shell: pwsh
        run: |
          $exe = "src/Camledian.Photobooth.App/bin/Release/net10.0-windows/CamledianPhotobooth.exe"
          $out = Join-Path $env:GITHUB_WORKSPACE "ui-screenshots"
          $proc = Start-Process -FilePath $exe -ArgumentList "--ui-capture", $out -PassThru
          if (-not $proc.WaitForExit(180000)) {
            $proc.Kill()
            throw "UI capture timed out after 180s."
          }
          $shots = @(Get-ChildItem $out -Filter *.png -ErrorAction SilentlyContinue)
          Write-Host "Captured $($shots.Count) screenshot(s)."
          if ($shots.Count -eq 0) { throw "UI capture produced no screenshots." }

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kiosk-ui-screenshots
          path: ui-screenshots/**

      # Serilog writes next to the exe (StoragePaths resolves "data/logs" against AppContext.BaseDirectory).
      # Without this a crash in the capture pass would surface only as "produced no screenshots".
      - name: Upload app logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kiosk-ui-capture-logs
          path: src/Camledian.Photobooth.App/bin/Release/net10.0-windows/data/logs/**
          if-no-files-found: ignore

  # Builds the downloadable, self-contained CamledianPhotobooth.exe. Deliberately NOT run on every
  # push/PR (Windows runners bill at a 2x minute multiplier and this step alone re-restores/publishes
  # ~280MB) — only on a manual "Run workflow" click or when a v* tag is pushed (i.e. an actual release).
  publish-app:
    name: Publish Windows app (exe)
    needs: dotnet
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # Self-contained, single-file .exe — no separate .NET runtime install needed on the kiosk PC.
      # Native libraries (OpenCvSharp, ONNX Runtime, SQLite) that can't live inside the single file
      # are extracted next to it at first run, via IncludeNativeLibrariesForSelfExtract.
      - name: Publish Windows app (self-contained exe)
        run: >
          dotnet publish src/Camledian.Photobooth.App/Camledian.Photobooth.App.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -o publish/CamledianPhotobooth

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: CamledianPhotobooth-windows-x64
          path: publish/CamledianPhotobooth/**
