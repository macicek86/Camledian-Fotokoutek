name: .NET CI

on:
  # Build+test is already run locally before every push, so there's no automatic push/PR trigger
  # here — only a manual run, or a v* release tag (which needs the build+test job as a gate before
  # publish-app runs).
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  dotnet:
    name: .NET solution (build + test)
    # Full compilation and verification of the Windows app happens here, on a real Windows runner —
    # local development only needs to compile the cross-platform pieces (see Directory.Build.props'
    # EnableWindowsTargeting for how that's possible on Linux at all).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Camledian.Photobooth.slnx

      - name: Build
        run: dotnet build Camledian.Photobooth.slnx -c Release --no-restore

      - name: Test
        run: dotnet test Camledian.Photobooth.slnx -c Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-test-results
          path: "**/test-results.trx"

  # A release must never ship an exe whose tests didn't pass, so the v* tag path keeps the build+test
  # gate. The publish itself lives in build-exe.yml — run that directly to get an exe without paying
  # for build+test, which is the common case.
  publish-app:
    name: Publish Windows app (exe)
    needs: dotnet
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/build-exe.yml
