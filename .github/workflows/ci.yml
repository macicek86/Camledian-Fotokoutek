name: .NET CI

on:
  # Build+test is already run locally before every push, so there's no automatic push/PR trigger
  # here — only a manual run, or a v* release tag (which needs the build+test job as a gate before
  # publish-app runs).
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  dotnet:
    name: .NET solution (build + test)
    # Full compilation and verification of the Windows app happens here, on a real Windows runner —
    # local development only needs to compile the cross-platform pieces (see Directory.Build.props'
    # EnableWindowsTargeting for how that's possible on Linux at all).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Camledian.Photobooth.slnx

      - name: Build
        run: dotnet build Camledian.Photobooth.slnx -c Release --no-restore

      - name: Test
        run: dotnet test Camledian.Photobooth.slnx -c Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-test-results
          path: "**/test-results.trx"

  # Builds the downloadable, self-contained CamledianPhotobooth.exe. Deliberately NOT run on every
  # push/PR (Windows runners bill at a 2x minute multiplier and this step alone re-restores/publishes
  # ~280MB) — only on a manual "Run workflow" click or when a v* tag is pushed (i.e. an actual release).
  publish-app:
    name: Publish Windows app (exe)
    needs: dotnet
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # Self-contained, single-file .exe — no separate .NET runtime install needed on the kiosk PC.
      # Native libraries (OpenCvSharp, ONNX Runtime, SQLite) that can't live inside the single file
      # are extracted next to it at first run, via IncludeNativeLibrariesForSelfExtract.
      - name: Publish Windows app (self-contained exe)
        run: >
          dotnet publish src/Camledian.Photobooth.App/Camledian.Photobooth.App.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -o publish/CamledianPhotobooth

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: CamledianPhotobooth-windows-x64
          path: publish/CamledianPhotobooth/**
