name: Cloud CI

on:
  # Typecheck+test is already run locally before every push — this workflow is manual-only now.
  workflow_dispatch:

jobs:
  cloud:
    name: Cloudflare Worker (typecheck + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: cloud/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run build

      - name: Test
        run: npm test
